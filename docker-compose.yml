services:
  # ============================================================================
  # PostgreSQL 16 Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: social_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-social_platform_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-social_platform_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - social_network

  # ============================================================================
  # Redis 7 In-Memory Cache & Message Broker
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: social_platform_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - social_network

  # ============================================================================
  # MinIO Object Storage (S3-Compatible Local Store)
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: social_platform_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - social_network

  # MinIO Bucket Auto-Provisioning
  minio-init:
    image: minio/mc:latest
    container_name: social_platform_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set localminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadminpassword};
      mc mb --ignore-existing localminio/${S3_BUCKET_NAME:-social-media-media};
      mc anonymous set download localminio/${S3_BUCKET_NAME:-social-media-media};
      exit 0;
      "
    networks:
      - social_network

  # ============================================================================
  # MailHog Mock SMTP & Web Email Inbox
  # ============================================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: social_platform_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    networks:
      - social_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  social_network:
    driver: bridge
